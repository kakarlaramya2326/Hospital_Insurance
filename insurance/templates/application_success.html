<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Application Successful</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f4f8fb;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .success-box {
            background: white;
            width: 90%;
            max-width: 550px;
            padding: 50px 35px;
            text-align: center;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.10);
        }

        .success-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 25px;
            border-radius: 50%;
            background: #0f766e;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 42px;
        }

        h1 {
            color: #0f766e;
            margin-bottom: 15px;
        }

        p {
            color: #64748b;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .home-btn {
            display: inline-block;
            padding: 13px 28px;
            background: #0f766e;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            margin: 5px;
        }

        .plans-btn {
            display: inline-block;
            padding: 13px 28px;
            background: #e2e8f0;
            color: #334155;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            margin: 5px;
        }
    </style>
</head>

<body>

    <div class="success-box">

        <div class="success-icon">
            ✓
        </div>

        <h1>Application Submitted!</h1>

        <p>
            Thank you for choosing MediCare Insurance.
            Your insurance application has been successfully submitted.
        </p>

        <p>
            Our team will review your application and contact you
            using the details provided.
        </p>

        <a href="/" class="home-btn">
            Go to Home
        </a>

        <a href="/plans/" class="plans-btn">
            View Plans
        </a>

    </div>

</body>
</html>
